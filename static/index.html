<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水资源权配置</title>
<style>body{font:15px/1.5 system-ui,sans-serif;max-width:980px;margin:32px auto;padding:0 18px}input,select,button{padding:7px;margin:3px}.card{border:1px solid #d9e1e8;border-radius:10px;padding:16px;margin:16px 0}pre{background:#f5f7f9;padding:12px;overflow:auto}small{color:#667}button{cursor:pointer}table{border-collapse:collapse;margin:8px 0}th,td{border:1px solid #d9e1e8;padding:4px 10px;text-align:right}th:first-child,td:first-child{text-align:left}</style></head>
<body><h1>跨区域水资源使用权</h1><p>示例账户初始化后，可查看余额、发起转让、审核，并模拟干旱分配。年度切换时可生成结转批次：先扣已用水量和待审批转出量，最多把许可额度的两成结入下一年结转池，其余作废；下一年取水先扣当年额度再动结转池，转让不认结转水量。</p>
<div class="card"><h2>身份</h2><input id="user" value="alice"><select id="role"><option>editor</option><option>reviewer</option><option>meter</option><option>viewer</option></select></div>
<div class="card"><h2>账户</h2><button onclick="getAccounts()">刷新账户</button><pre id="accounts">等待操作…</pre></div>
<div class="card"><h2>发起转让</h2><input id="from" type="number" value="1" placeholder="转出账户"><input id="to" type="number" value="2" placeholder="转入账户"><input id="amount" type="number" value="400"><input id="date" type="date" value="2026-06-01"><button onclick="transfer()">提交审批</button><pre id="result"></pre></div>
<div class="card"><h2>审批最新转让</h2><input id="transfer_id" type="number" placeholder="转让 ID"><button onclick="approve()">批准</button><button onclick="reject()">退回</button></div>
<div class="card"><h2>年度结转</h2><input id="co_year" type="number" value="2026"><input id="co_ids" placeholder="账户ID,逗号分隔;留空为全部"><input id="co_note" placeholder="备注"><button onclick="makeCarryover()">生成结转批次</button><pre id="co_result"></pre><small>同一账户同一年只能结转一次，重复提交会指出原批次。</small></div>
<div class="card"><h2>结转批次与账户明细</h2><button onclick="getBatches()">刷新批次</button><input id="co_bid" type="number" placeholder="批次 ID"><button onclick="getBatch()">查看明细</button><div id="co_list"></div><div id="co_detail"></div></div>
<div class="card"><h2>干旱情景</h2><input id="supply" type="number" value="1200"><input id="reduction" type="number" value="0.3" step="0.1"><button onclick="simulate()">模拟</button><pre id="drought">等待操作…</pre></div>
<script>
const headers=()=>({'Content-Type':'application/json','X-User':user.value,'X-Role':role.value});
async function call(url,opts={}){const r=await fetch(url,opts);const j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j}
async function getAccounts(){try{accounts.textContent=JSON.stringify(await call('/api/accounts'),null,2)}catch(e){accounts.textContent=e.message}}
async function transfer(){try{result.textContent=JSON.stringify(await call('/api/transfers',{method:'POST',headers:headers(),body:JSON.stringify({from_account_id:+from.value,to_account_id:+to.value,amount:+amount.value,effective_date:date.value})}),null,2)}catch(e){result.textContent=e.message}}
async function approve(){try{result.textContent=JSON.stringify(await call('/api/transfers/'+transfer_id.value+'/approve',{method:'POST',headers:headers(),body:'{}'}),null,2)}catch(e){result.textContent=e.message}}
async function reject(){try{result.textContent=JSON.stringify(await call('/api/transfers/'+transfer_id.value+'/reject',{method:'POST',headers:headers(),body:'{}'}),null,2)}catch(e){result.textContent=e.message}}
async function simulate(){try{drought.textContent=JSON.stringify(await call('/api/drought/simulate?supply='+supply.value+'&reduction='+reduction.value),null,2)}catch(e){drought.textContent=e.message}}
const sum=(arr,k)=>arr.reduce((s,e)=>s+(+e[k]||0),0);
async function makeCarryover(){try{const ids=co_ids.value.trim()?co_ids.value.split(',').map(s=>+s.trim()).filter(n=>!isNaN(n)):[];co_result.textContent=JSON.stringify(await call('/api/carryover/batches',{method:'POST',headers:headers(),body:JSON.stringify({year:+co_year.value,account_ids:ids,note:co_note.value})}),null,2)}catch(e){co_result.textContent=e.message}}
async function getBatches(){try{const j=await call('/api/carryover/batches');co_list.innerHTML='<table><tr><th>批次</th><th>年份</th><th>账户数</th><th>结转总量</th><th>作废总量</th><th>操作人</th><th>备注</th></tr>'+j.batches.map(b=>`<tr><td>#${b.id}</td><td>${b.year}</td><td>${b.entries.length}</td><td>${sum(b.entries,'carried')}</td><td>${sum(b.entries,'forfeited')}</td><td>${b.actor}</td><td>${b.note||''}</td></tr>`).join('')+'</table>'}catch(e){co_list.textContent=e.message}}
async function getBatch(){try{const j=await call('/api/carryover/batches/'+co_bid.value);co_detail.innerHTML=`<h3>批次 #${j.batch.id} · ${j.batch.year} 年结转前后明细（按账户）</h3><table><tr><th>账户</th><th>许可额度</th><th>已用水量</th><th>待审批转出</th><th>剩余水量</th><th>两成上限</th><th>实际结转</th><th>作废</th><th>结转池余额</th></tr>`+j.entries.map(e=>`<tr><td>${e.account_name}</td><td>${e.quota}</td><td>${e.used}</td><td>${e.reserved}</td><td>${e.unused}</td><td>${e.cap}</td><td>${e.carried}</td><td>${e.forfeited}</td><td>${e.remaining}</td></tr>`).join('')+'</table>'}catch(e){co_detail.textContent=e.message}}
</script></body></html>
